name: PSX KMI-30 Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: "true"
        run: python main.py

      # Keep this step disabled during initial testing.
      # Change DRY_RUN to "false" only after field verification and testing.
